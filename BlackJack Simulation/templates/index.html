<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack Simulator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div id="setup-screen">
            <h1>Blackjack Simulator</h1>
            <div class="setup-controls">
                <label for="num-players">Number of Human Players:</label>
                <input type="number" id="num-players" min="1" max="5" value="1">

                <label for="num-ai-players">Number of AI Players:</label>
                <input type="number" id="num-ai-players" min="0" max="4" value="0">

                <button id="start-game-btn">Start Game</button>
            </div>
        </div>

        <div id="game-screen" class="hidden">
            <div class="dealer-area">
                <h2>Dealer</h2>
                <div id="dealer-cards" class="cards-container"></div>
                <div id="dealer-score" class="score"></div>
            </div>

            <div id="players-area" class="players-container">
                <!-- Players will be injected here -->
            </div>

            <div id="controls-area" class="controls hidden">
                <button id="hit-btn" class="action-btn">Hit</button>
                <button id="stand-btn" class="action-btn">Stand</button>
                <button id="split-btn" class="action-btn hidden">Split</button>
            </div>

            <div id="game-message" class="message hidden"></div>
            <div id="end-game-controls" class="hidden">
                <button id="next-round-btn">Next Round</button>
                <button id="new-game-btn">New Game</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
